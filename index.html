<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>音声翻訳テスト</title>
</head>
<body>
    <h1>音声翻訳アプリ</h1>
    <button id="recordButton">録音・送信テスト</button>
    <p id="status">ボタンを押してください</p>

    <script>
        document.getElementById('recordButton').onclick = async () => {
            document.getElementById('status').innerText = '処理中...';
            try {
                // ダミーの空ファイルを送信してサーバーとの通信テストを行う
                const blob = new Blob(["dummy audio"], { type: 'audio/wav' });
                const formData = new FormData();
                formData.append('file', blob, 'test.wav');

                const response = await fetch('/translate', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    document.getElementById('status').innerText = '通信成功！';
                } else {
                    document.getElementById('status').innerText = 'サーバーエラー: ' + response.status;
                }
            } catch (err) {
                document.getElementById('status').innerText = '通信失敗: ' + err.message;
            }
        };
    </script>
</body>
</html>
