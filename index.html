<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>おーはた翻訳機pro</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 50px; background-color: #f4f7f6; }
        .container { background: white; padding: 30px; border-radius: 10px; display: inline-block; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); width: 400px; }
        button { font-size: 18px; padding: 12px 24px; cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 5px; font-weight: bold; }
        button:hover { background-color: #0056b3; }
        #status { margin-top: 20px; font-weight: bold; color: #333; }
        .result-box { margin-top: 20px; text-align: left; background: #f9f9f9; padding: 15px; border-radius: 5px; font-size: 15px; color: #333; word-break: break-all; }
        .result-box p { margin: 10px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>おーはた翻訳機pro</h1>
        <p style="color: #666; font-size: 14px;">(日本語 ➔ 英語 翻訳)</p>
        <br>

        <button id="recordButton">録音開始</button>
        <p id="status">ボタンを押して話してください</p>
        
        <div class="result-box">
            <p><strong>認識した言葉:</strong><br><span id="recognizedText">-</span></p>
            <p><strong>翻訳テキスト (English):</strong><br><span id="translatedText">-</span></p>
        </div>
    </div>

    <script>
        let mediaRecorder;
        let audioChunks = [];
        const button = document.getElementById('recordButton');
        const status = document.getElementById('status');
        const recognizedTextSpan = document.getElementById('recognizedText');
        const translatedTextSpan = document.getElementById('translatedText');

        // ブラウザ標準の読み上げ機能
        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // 前の音声を停止
                const uttr = new SpeechSynthesisUtterance(text);
                uttr.lang = 'en-US'; // 英語で再生
                window.speechSynthesis.speak(uttr);
            }
        }

        button.onclick = async () => {
            if (!mediaRecorder || mediaRecorder.state === "inactive") {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
                    audioChunks = [];

                    mediaRecorder.ondataavailable = event => {
                        audioChunks.push(event.data);
                    };

                    mediaRecorder.onstop = async () => {
                        status.innerText = "高速翻訳中...";
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        
                        const formData = new FormData();
                        formData.append('file', audioBlob, 'recording.webm');

                        try {
                            const response = await fetch('/translate', {
                                method: 'POST',
                                body: formData
                            });

                            if (response.ok) {
                                const data = await response.json();

                                recognizedTextSpan.innerText = data.recognized || "-";
                                translatedTextSpan.innerText = data.translated || "-";
                                status.innerText = "翻訳完了！";

                                // ブラウザ機能で英語をスピーチ
                                if (data.translated && data.translated !== "-") {
                                    speakText(data.translated);
                                }
                            } else {
                                status.innerText = "サーバーエラーが発生しました";
                            }
                        } catch (err) {
                            status.innerText = "通信エラー: " + err.message;
                        }
                        button.innerText = "録音開始";
                    };

                    mediaRecorder.start();
                    button.innerText = "録音停止（送信）";
                    status.innerText = "録音中... 話し終わったらボタンを押してください";
                    recognizedTextSpan.innerText = "-";
                    translatedTextSpan.innerText = "-";
                } catch (err) {
                    status.innerText = "マイクへのアクセスが許可されていません";
                }
            } else {
                mediaRecorder.stop();
            }
        };
    </script>
</body>
</html>
