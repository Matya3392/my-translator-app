<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>おーはたの翻訳機 Pro</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0a0e17;
      --card-bg: rgba(18, 26, 43, 0.75);
      --accent-cyan: #00f2fe;
      --accent-blue: #4facfe;
      --accent-purple: #7f00ff;
      --accent-pink: #e100ff;
      --danger: #ff0844;
      --text-main: #f0f6fc;
      --text-sub: #8b949e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; }

    body {
      background: #060913;
      background-image: 
        radial-gradient(at 10% 20%, rgba(0, 242, 254, 0.15) 0px, transparent 50%),
        radial-gradient(at 90% 80%, rgba(127, 0, 255, 0.2) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(225, 0, 255, 0.08) 0px, transparent 50%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      overflow-x: hidden;
    }

    .app-card {
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      width: 100%;
      max-width: 440px;
      padding: 28px 24px;
      box-shadow: 
        0 30px 60px rgba(0, 0, 0, 0.6),
        0 0 40px rgba(0, 242, 254, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
      display: flex;
      flex-direction: column;
      gap: 22px;
      position: relative;
    }

    /* ヘッダー */
    .header {
      text-align: center;
      position: relative;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      background: rgba(0, 242, 254, 0.1);
      border: 1px solid rgba(0, 242, 254, 0.3);
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--accent-cyan);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .header h1 {
      font-size: 1.6rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff 0%, var(--accent-cyan) 50%, var(--accent-purple) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    /* 言語選択 */
    .lang-section {
      background: rgba(10, 14, 23, 0.7);
      padding: 14px 18px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.4);
      transition: border-color 0.3s;
    }
    .lang-section:focus-within {
      border-color: rgba(0, 242, 254, 0.5);
    }
    .lang-label {
      font-size: 0.72rem;
      color: var(--accent-cyan);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    select {
      width: 100%;
      background: transparent;
      border: none;
      color: #ffffff;
      font-size: 1.05rem;
      font-weight: 700;
      outline: none;
      cursor: pointer;
    }
    select option {
      background: #0f172a;
      color: #ffffff;
    }

    /* チャットディスプレイ */
    .chat-container {
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 200px;
    }
    .chat-bubble {
      padding: 16px 18px;
      border-radius: 20px;
      font-size: 0.95rem;
      line-height: 1.6;
      position: relative;
      transition: all 0.3s ease;
    }
    .chat-bubble.user {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #d1d5db;
    }
    .chat-bubble.translated {
      background: linear-gradient(135deg, rgba(79, 70, 229, 0.25) 0%, rgba(127, 0, 255, 0.25) 100%);
      border: 1px solid rgba(127, 0, 255, 0.4);
      box-shadow: 0 8px 24px rgba(127, 0, 255, 0.15);
      color: #ffffff;
    }
    .bubble-title {
      font-size: 0.7rem;
      font-weight: 700;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .user .bubble-title { color: var(--text-sub); }
    .translated .bubble-title { color: var(--accent-cyan); }

    /* サウンドウェーブ演出 (録音中) */
    .wave-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 4px;
      height: 20px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .wave-container.active {
      opacity: 1;
    }
    .wave-bar {
      width: 3px;
      height: 100%;
      background: var(--danger);
      border-radius: 3px;
      animation: wave 1.2s ease-in-out infinite;
    }
    .wave-bar:nth-child(1) { animation-delay: 0.0s; }
    .wave-bar:nth-child(2) { animation-delay: 0.2s; }
    .wave-bar:nth-child(3) { animation-delay: 0.4s; }
    .wave-bar:nth-child(4) { animation-delay: 0.1s; }
    .wave-bar:nth-child(5) { animation-delay: 0.3s; }
    @keyframes wave {
      0%, 100% { height: 4px; }
      50% { height: 20px; }
    }

    /* コントロールボタン */
    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      margin-top: 6px;
    }
    .btn-wrapper {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .mic-btn {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 50%, #00c6ff 100%);
      color: #030712;
      font-size: 1.8rem;
      cursor: pointer;
      box-shadow: 
        0 10px 30px rgba(0, 242, 254, 0.4),
        0 0 20px rgba(0, 242, 254, 0.2);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2;
    }
    .mic-btn:hover {
      transform: scale(1.06);
      box-shadow: 0 12px 35px rgba(0, 242, 254, 0.6);
    }
    .mic-btn:active {
      transform: scale(0.92);
    }
    .mic-btn.recording {
      background: linear-gradient(135deg, #ff0844 0%, #ffb199 100%);
      color: #ffffff;
      box-shadow: 0 10px 30px rgba(255, 8, 68, 0.6);
    }

    /* 脈動エフェクト */
    .pulse-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: rgba(255, 8, 68, 0.4);
      opacity: 0;
      z-index: 1;
      pointer-events: none;
    }
    .mic-btn.recording ~ .pulse-ring {
      animation: pulse-ring 1.8s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      100% { transform: scale(1.7); opacity: 0; }
    }

    .status-text {
      font-size: 0.82rem;
      color: var(--text-sub);
      font-weight: 600;
      letter-spacing: 0.3px;
    }
  </style>
</head>
<body>

<div class="app-card">
  <div class="header">
    <div class="badge"><i class="fa-solid fa-sparkles"></i> AI Powered Engine</div>
    <h1>おーはたの翻訳機 Pro</h1>
  </div>

  <div class="lang-section">
    <div class="lang-label"><i class="fa-solid fa-earth-americas"></i> 翻訳先の言語 (Target Language)</div>
    <select id="lang">
      <option value="en">🇺🇸 英語 (English)</option>
      <option value="ja">🇯🇵 日本語 (Japanese)</option>
      <option value="zh-cn">🇨🇳 中国語 簡体字 (Chinese)</option>
      <option value="ko">🇰🇷 韓国語 (Korean)</option>
      <option value="fr">🇫🇷 フランス語 (French)</option>
      <option value="es">🇪🇸 スペイン語 (Spanish)</option>
      <option value="de">🇩🇪 ドイツ語 (German)</option>
      <option value="it">🇮🇹 イタリア語 (Italian)</option>
      <option value="ru">🇷🇺 ロシア語 (Russian)</option>
      <option value="th">🇹🇭 タイ語 (Thai)</option>
      <option value="vi">🇻🇳 ベトナム語 (Vietnamese)</option>
      <option value="id">🇮🇩 インドネシア語 (Indonesian)</option>
    </select>
  </div>

  <div class="chat-container">
    <div class="chat-bubble user">
      <div class="bubble-title"><i class="fa-solid fa-microphone"></i> 認識音声テキスト</div>
      <div id="recText">マイクボタンを押して話し始めてください</div>
    </div>

    <div class="chat-bubble translated">
      <div class="bubble-title"><i class="fa-solid fa-language"></i> リアルタイム翻訳結果</div>
      <div id="transText">-</div>
    </div>
  </div>

  <div class="wave-container" id="waveBox">
    <div class="wave-bar"></div>
    <div class="wave-bar"></div>
    <div class="wave-bar"></div>
    <div class="wave-bar"></div>
    <div class="wave-bar"></div>
  </div>

  <div class="controls">
    <div class="btn-wrapper">
      <button id="btn" class="mic-btn" onclick="toggle()">
        <i id="micIcon" class="fa-solid fa-microphone"></i>
      </button>
      <div class="pulse-ring"></div>
    </div>
    <div id="status" class="status-text">タップして音声録音を開始</div>
  </div>
</div>

<script>
  let recorder = null;
  let chunks = [];
  let isRec = false;

  async function toggle() {
    const btn = document.getElementById('btn');
    const micIcon = document.getElementById('micIcon');
    const status = document.getElementById('status');
    const waveBox = document.getElementById('waveBox');

    if (!isRec) {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        recorder = new MediaRecorder(stream);
        chunks = [];
        recorder.ondataavailable = e => chunks.push(e.data);
        recorder.onstop = async () => {
          const blob = new Blob(chunks, { type: 'audio/wav' });
          send(blob);
        };
        recorder.start();
        isRec = true;
        btn.classList.add('recording');
        waveBox.classList.add('active');
        micIcon.className = "fa-solid fa-square";
        status.innerText = "録音中... もう一度タップして送信";
        document.getElementById('recText').innerText = "音声を解析しています...";
        document.getElementById('transText').innerText = "-";
      } catch (e) {
        alert("マイクエラー: " + e.message);
      }
    } else {
      if (recorder) {
        recorder.stop();
        recorder.stream.getTracks().forEach(t => t.stop());
      }
      isRec = false;
      btn.classList.remove('recording');
      waveBox.classList.remove('active');
      micIcon.className = "fa-solid fa-circle-notch fa-spin";
      status.innerText = "AI翻訳処理中...";
      document.getElementById('recText').innerText = "音声認識・翻訳処理を実行中...";
    }
  }

  async function send(blob) {
    const micIcon = document.getElementById('micIcon');
    const status = document.getElementById('status');

    const fd = new FormData();
    fd.append('file', blob, 'audio.wav');
    fd.append('target_lang', document.getElementById('lang').value);

    try {
      const res = await fetch('/translate', { method: 'POST', body: fd });
      const data = await res.json();
      
      micIcon.className = "fa-solid fa-microphone";
      status.innerText = "タップして音声録音を開始";

      if (data.status === "error") {
        document.getElementById('recText').innerText = data.message;
        document.getElementById('transText').innerText = "-";
      } else {
        document.getElementById('recText').innerText = data.recognized_text || "-";
        document.getElementById('transText').innerText = data.translated_text || "-";

        if (data.audio_url) {
          const audio = new Audio(data.audio_url + "?t=" + new Date().getTime());
          audio.play().catch(e => console.log("音声再生エラー:", e));
        }
      }
    } catch (e) {
      micIcon.className = "fa-solid fa-microphone";
      status.innerText = "タップして音声録音を開始";
      document.getElementById('recText').innerText = "通信エラーが発生しました";
      alert("送信に失敗しました: " + e.message);
    }
  }
</script>

</body>
</html>
